{% assign viz_id = include.id | default: "mos-algorithm-demo" %}
<div id="{{ viz_id }}" class="mov-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 780px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .mov-controls { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} button { min-height: 2rem; border: 1px solid #b9c5d6; border-radius: 6px; background: #fff; color: #1f2937; font: inherit; font-size: 0.85rem; line-height: 1; padding: 0.45rem 0.65rem; cursor: pointer; }
    #{{ viz_id }} button:hover { background: #e6edf5; }
    #{{ viz_id }} button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .mov-status { margin-left: auto; color: #475569; font-size: 0.85rem; white-space: nowrap; }
    #{{ viz_id }} .mov-body { display: grid; gap: 0.8rem; padding: 0.85rem; background: #fff; }
    #{{ viz_id }} .mov-array { display: grid; grid-template-columns: repeat(10, minmax(42px, 1fr)); gap: 0.35rem; overflow-x: auto; }
    #{{ viz_id }} .mov-cell { min-width: 42px; border: 1px solid #94a3b8; border-radius: 6px; background: #f8fafc; padding: 0.35rem 0.25rem; text-align: center; line-height: 1.25; }
    #{{ viz_id }} .mov-cell-range { background: #dbeafe; border-color: #2563eb; border-width: 2px; }
    #{{ viz_id }} .mov-cell-left, #{{ viz_id }} .mov-cell-right { background: #fee2e2; border-color: #dc2626; border-width: 2px; }
    #{{ viz_id }} .mov-cell-index { display: block; font-size: 0.72rem; color: #64748b; }
    #{{ viz_id }} .mov-cell-value { display: block; font-weight: 700; }
    #{{ viz_id }} .mov-info { display: grid; gap: 0.45rem; line-height: 1.65; }
    #{{ viz_id }} .mov-info-line { overflow-x: auto; white-space: nowrap; }
    #{{ viz_id }} code { padding: 0.08rem 0.38rem; border-radius: 0.35rem; background: rgba(148,163,184,0.14); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.94em; }
    #{{ viz_id }} .mov-query-list { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    #{{ viz_id }} .mov-query { border: 1px solid #cbd5e1; border-radius: 999px; padding: 0.2rem 0.55rem; background: #f8fafc; font-size: 0.9em; }
    #{{ viz_id }} .mov-query-active { border-color: #2563eb; background: #dbeafe; font-weight: 700; }
  </style>

  <div class="mov-controls">
    <button type="button" data-role="prev">Previous Query</button>
    <button type="button" data-role="next">Next Query</button>
    <button type="button" data-role="reset">Reset</button>
    <span class="mov-status" data-role="status"></span>
  </div>
  <div class="mov-body">
    <div class="mov-array" data-role="array"></div>
    <div class="mov-info">
      <div class="mov-info-line"><strong>Sorted query order:</strong> <span class="mov-query-list" data-role="queries"></span></div>
      <div class="mov-info-line"><strong>Current range:</strong> <span data-role="range"></span></div>
      <div class="mov-info-line"><strong>Pointer shifts:</strong> <span data-role="shift"></span></div>
      <div class="mov-info-line"><strong>Answer:</strong> <span data-role="answer"></span></div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;

      function byRole(name) { return root.querySelector('[data-role="' + name + '"]'); }
      function code(s) { return "<code>" + String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + "</code>"; }

      var arr = [0, 1, 2, 1, 3, 2, 2, 4, 1, 5, 3];
      var n = arr.length - 1;
      var block = Math.ceil(Math.sqrt(n));
      var queries = [
        { id: 0, l: 1, r: 4 },
        { id: 1, l: 3, r: 8 },
        { id: 2, l: 2, r: 6 },
        { id: 3, l: 7, r: 10 },
        { id: 4, l: 1, r: 10 }
      ].sort(function (a, b) {
        var ba = Math.floor((a.l - 1) / block);
        var bb = Math.floor((b.l - 1) / block);
        if (ba !== bb) return ba - bb;
        return a.r - b.r;
      });

      function distinct(l, r) {
        var seen = {};
        for (var i = l; i <= r; i++) seen[arr[i]] = true;
        return Object.keys(seen).length;
      }

      function buildStates() {
        var states = [{ l: 1, r: 0, q: null, prev: null, answer: "-", shift: "empty range", title: "Initialization" }];
        var l = 1, r = 0;
        queries.forEach(function (q, idx) {
          var prev = { l: l, r: r };
          var shifts = Math.abs(q.l - l) + Math.abs(q.r - r);
          l = q.l;
          r = q.r;
          states.push({
            l: l,
            r: r,
            q: q,
            prev: prev,
            answer: distinct(l, r),
            shift: "|" + q.l + "-" + prev.l + "| + |" + q.r + "-" + prev.r + "| = " + shifts,
            title: "Process query #" + q.id + " = [" + q.l + ":" + q.r + "]"
          });
        });
        return states;
      }

      var states = buildStates();
      var index = 0;

      function renderArray(s) {
        var out = "";
        for (var i = 1; i <= n; i++) {
          var cls = "mov-cell";
          if (s.l <= i && i <= s.r) cls += " mov-cell-range";
          if (i === s.l) cls += " mov-cell-left";
          if (i === s.r) cls += " mov-cell-right";
          out += '<div class="' + cls + '"><span class="mov-cell-index">' + i + '</span><span class="mov-cell-value">' + arr[i] + '</span></div>';
        }
        byRole("array").innerHTML = out;
      }

      function renderQueries(s) {
        byRole("queries").innerHTML = queries.map(function (q) {
          var cls = s.q && s.q.id === q.id ? "mov-query mov-query-active" : "mov-query";
          return '<span class="' + cls + '">q' + q.id + '=[' + q.l + ':' + q.r + ']</span>';
        }).join("");
      }

      function render() {
        var s = states[index];
        byRole("status").textContent = index + " / " + (states.length - 1) + "  B = " + block;
        byRole("range").innerHTML = s.q ? code("[" + s.l + ":" + s.r + "]") : code("empty");
        byRole("shift").innerHTML = code(s.shift);
        byRole("answer").innerHTML = s.answer === "-" ? code("-") : code("distinct = " + s.answer);
        byRole("prev").disabled = index === 0;
        byRole("next").disabled = index === states.length - 1;
        renderArray(s);
        renderQueries(s);
      }

      byRole("prev").addEventListener("click", function () { if (index > 0) { index -= 1; render(); } });
      byRole("next").addEventListener("click", function () { if (index < states.length - 1) { index += 1; render(); } });
      byRole("reset").addEventListener("click", function () { index = 0; render(); });
      render();
    })();
  </script>
</div>
