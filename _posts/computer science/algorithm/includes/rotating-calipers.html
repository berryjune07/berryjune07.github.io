<div id="rotating-calipers-visualizer" class="rcv-panel">
  <div class="rcv-toolbar">
    <button type="button" data-action="prev">Prev</button>
    <button type="button" data-action="step">Step</button>
    <button type="button" data-action="run">Run</button>
    <button type="button" data-action="reset">Reset</button>
    <button type="button" data-action="random">Random</button>
    <span class="rcv-status" data-role="status"></span>
  </div>
  <canvas aria-label="Rotating calipers diameter visualizer"></canvas>
</div>

<style>
  .rcv-panel {
    width: 100%;
    max-width: 760px;
    margin: 1.25rem auto;
    border: 1px solid #d8dee8;
    border-radius: 8px;
    background: #f8fafc;
    overflow: hidden;
  }

  .rcv-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    padding: 0.65rem;
    border-bottom: 1px solid #d8dee8;
    background: #eef3f8;
  }

  .rcv-toolbar button {
    border: 1px solid #b9c5d6;
    border-radius: 6px;
    background: #ffffff;
    color: #1f2937;
    font: inherit;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0.45rem 0.65rem;
    cursor: pointer;
  }

  .rcv-toolbar button:hover {
    background: #e6edf5;
  }

  .rcv-status {
    margin-left: auto;
    color: #475569;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .rcv-panel canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #ffffff;
    cursor: crosshair;
  }
</style>

<script>
(() => {
  const root = document.getElementById("rotating-calipers-visualizer");
  if (!root) return;

  const canvas = root.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const status = root.querySelector("[data-role='status']");
  const buttons = root.querySelectorAll("button[data-action]");

  let points = [
    {x: 14, y: 20}, {x: 20, y: 70}, {x: 34, y: 88}, {x: 58, y: 83},
    {x: 80, y: 61}, {x: 88, y: 28}, {x: 63, y: 10}, {x: 31, y: 12},
    {x: 44, y: 45}, {x: 67, y: 49}, {x: 51, y: 28}
  ];

  let hull = [];
  let states = [];
  let step = 0;
  let timer = null;
  let view = {scale: 1, ox: 0, oy: 0, h: 1};

  function sub(a, b) {
    return {x: a.x - b.x, y: a.y - b.y};
  }

  function cross(a, b) {
    return a.x * b.y - a.y * b.x;
  }

  function ccw(a, b, c) {
    return cross(sub(b, a), sub(c, a));
  }

  function dist2(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return dx * dx + dy * dy;
  }

  function clonePoint(p) {
    return {x: p.x, y: p.y};
  }

  function clonePair(pair) {
    return pair ? [clonePoint(pair[0]), clonePoint(pair[1])] : null;
  }

  function convexHull(input) {
    const pts = input
      .slice()
      .sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x);
    const unique = [];
    for (const p of pts) {
      const last = unique[unique.length - 1];
      if (!last || last.x !== p.x || last.y !== p.y) unique.push(p);
    }
    if (unique.length <= 1) return unique.map(clonePoint);

    const lower = [];
    for (const p of unique) {
      while (lower.length >= 2 && ccw(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
        lower.pop();
      }
      lower.push(p);
    }

    const upper = [];
    for (let i = unique.length - 1; i >= 0; i--) {
      const p = unique[i];
      while (upper.length >= 2 && ccw(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
        upper.pop();
      }
      upper.push(p);
    }

    lower.pop();
    upper.pop();
    return lower.concat(upper).map(clonePoint);
  }

  function buildStates() {
    hull = convexHull(points);
    states = [];
    step = 0;

    const n = hull.length;
    if (n === 0) {
      states.push({phase: "empty", best: null, bestDist: 0});
      return;
    }
    if (n === 1) {
      states.push({phase: "point", i: 0, j: 0, best: [hull[0], hull[0]], bestDist: 0});
      return;
    }
    if (n === 2) {
      states.push({phase: "segment", i: 0, j: 1, best: [hull[0], hull[1]], bestDist: dist2(hull[0], hull[1])});
      return;
    }

    const area = (i, j) => {
      const ni = (i + 1) % n;
      return cross(sub(hull[ni], hull[i]), sub(hull[j], hull[i]));
    };

    let j = 1;
    let bestDist = 0;
    let best = [hull[0], hull[0]];

    const updateBest = (a, b) => {
      const d = dist2(a, b);
      if (d > bestDist) {
        bestDist = d;
        best = [a, b];
      }
    };

    for (let i = 0; i < n; i++) {
      const ni = (i + 1) % n;
      let guard = 0;
      while (area(i, (j + 1) % n) > area(i, j) && guard < n + 1) {
        states.push({
          phase: "advance",
          i,
          j,
          next: (j + 1) % n,
          best: clonePair(best),
          bestDist
        });
        j = (j + 1) % n;
        guard++;
      }

      updateBest(hull[i], hull[j]);
      updateBest(hull[ni], hull[j]);
      states.push({
        phase: "check",
        i,
        j,
        next: null,
        best: clonePair(best),
        bestDist
      });
    }
  }

  function fitCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * ratio));
    canvas.height = Math.max(1, Math.floor(rect.height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  function computeView(all) {
    const rect = canvas.getBoundingClientRect();
    const pad = 30;
    if (!all.length) {
      view = {scale: 1, ox: pad, oy: pad, h: rect.height};
      return;
    }

    const minX = Math.min(...all.map(p => p.x));
    const maxX = Math.max(...all.map(p => p.x));
    const minY = Math.min(...all.map(p => p.y));
    const maxY = Math.max(...all.map(p => p.y));
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);
    const scale = Math.min((rect.width - 2 * pad) / w, (rect.height - 2 * pad) / h);
    view = {
      scale,
      ox: pad - minX * scale + ((rect.width - 2 * pad) - w * scale) / 2,
      oy: pad - minY * scale + ((rect.height - 2 * pad) - h * scale) / 2,
      h: rect.height
    };
  }

  function sx(p) {
    return view.ox + p.x * view.scale;
  }

  function sy(p) {
    return view.h - (view.oy + p.y * view.scale);
  }

  function worldFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left - view.ox) / view.scale;
    const y = ((rect.height - (event.clientY - rect.top)) - view.oy) / view.scale;
    return {
      x: Math.max(0, Math.min(100, x)),
      y: Math.max(0, Math.min(100, y))
    };
  }

  function drawPoint(p, fill, radius) {
    ctx.beginPath();
    ctx.arc(sx(p), sy(p), radius, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawSegment(a, b, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(sx(a), sy(a));
    ctx.lineTo(sx(b), sy(b));
    ctx.stroke();
  }

  function drawLineThrough(p, dir, color) {
    const len = 1000;
    const norm = Math.hypot(dir.x, dir.y) || 1;
    const ux = dir.x / norm;
    const uy = dir.y / norm;
    const a = {x: p.x - ux * len, y: p.y - uy * len};
    const b = {x: p.x + ux * len, y: p.y + uy * len};
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(sx(a), sy(a));
    ctx.lineTo(sx(b), sy(b));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPolygon(poly) {
    if (!poly.length) return;
    ctx.fillStyle = "rgba(148, 163, 184, 0.14)";
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(sx(poly[0]), sy(poly[0]));
    for (let i = 1; i < poly.length; i++) ctx.lineTo(sx(poly[i]), sy(poly[i]));
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  function draw() {
    if (!states.length) buildStates();
    const state = states[Math.min(step, states.length - 1)];
    const rect = canvas.getBoundingClientRect();
    computeView(points);
    ctx.clearRect(0, 0, rect.width, rect.height);

    for (const p of points) drawPoint(p, "#94a3b8", 3.7);
    drawPolygon(hull);

    if (hull.length >= 2 && state.i !== undefined && state.j !== undefined) {
      const n = hull.length;
      const ni = (state.i + 1) % n;
      const edge = sub(hull[ni], hull[state.i]);
      drawLineThrough(hull[state.i], edge, "rgba(220, 38, 38, 0.55)");
      drawLineThrough(hull[state.j], edge, "rgba(37, 99, 235, 0.55)");
      drawSegment(hull[state.i], hull[ni], "#dc2626", 4);
      drawPoint(hull[state.j], "#2563eb", 6);
      if (state.next !== null && state.next !== undefined) drawPoint(hull[state.next], "#f59e0b", 5.5);
    }

    if (state.best) drawSegment(state.best[0], state.best[1], "#059669", 3.5);
    for (const p of hull) drawPoint(p, "#0f172a", 4.5);

    const best = state.bestDist ? Math.sqrt(state.bestDist).toFixed(2) : "0.00";
    status.textContent = (step + 1) + " / " + states.length + "  " + state.phase + "  d=" + best;
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  function rebuild() {
    stop();
    buildStates();
    draw();
  }

  function randomPoints() {
    const next = [];
    for (let i = 0; i < 15; i++) {
      next.push({
        x: 8 + Math.random() * 84,
        y: 8 + Math.random() * 84
      });
    }
    points = next;
    rebuild();
  }

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      const action = button.dataset.action;
      if (action === "prev") {
        stop();
        step = Math.max(0, step - 1);
      } else if (action === "step") {
        stop();
        step = Math.min(states.length - 1, step + 1);
      } else if (action === "run") {
        if (timer) {
          stop();
        } else {
          timer = setInterval(() => {
            if (step >= states.length - 1) stop();
            else {
              step++;
              draw();
            }
          }, 560);
        }
      } else if (action === "reset") {
        rebuild();
        return;
      } else if (action === "random") {
        randomPoints();
        return;
      }
      draw();
    });
  });

  canvas.addEventListener("click", event => {
    points.push(worldFromEvent(event));
    rebuild();
  });

  buildStates();
  new ResizeObserver(fitCanvas).observe(canvas);
  fitCanvas();
})();
</script>
