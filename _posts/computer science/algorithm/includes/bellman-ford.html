{% assign viz_id = include.id | default: "bellman-ford-demo" %}
<div id="{{ viz_id }}" class="bfv-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 760px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .bfv-stack { display: grid; gap: 0; }
    #{{ viz_id }} .bfv-graph { width: 100%; padding: 0.65rem 0.75rem 0.45rem; background: #ffffff; overflow: hidden; }
    #{{ viz_id }} .bfv-graph svg { display: block; width: 100%; max-width: 650px; height: auto; margin: 0 auto; }
    #{{ viz_id }} .bfv-status { margin: 0; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #f8fafc; line-height: 1.65; }
    #{{ viz_id }} .bfv-status p { margin: 0; }
    #{{ viz_id }} code { padding: 0.08rem 0.38rem; border-radius: 0.35rem; background: rgba(148,163,184,0.14); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.94em; }
    #{{ viz_id }} .bfv-controls-shell { padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} .bfv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
    #{{ viz_id }} .bfv-controls button { appearance: none; display: inline-flex; align-items: center; justify-content: center; min-height: 2rem; border: 1px solid #b9c5d6; background: #ffffff; color: #1f2937; border-radius: 6px; padding: 0.45rem 0.65rem; font: inherit; font-size: 0.85rem; line-height: 1; cursor: pointer; white-space: nowrap; }
    #{{ viz_id }} .bfv-controls button:hover { background: #e6edf5; }
    #{{ viz_id }} .bfv-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .bfv-counter { margin-left: auto; color: #475569; font-size: 0.85rem; white-space: nowrap; }
    #{{ viz_id }} .bfv-info { display: grid; gap: 0.45rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; line-height: 1.65; }
    #{{ viz_id }} .bfv-line { overflow-x: auto; white-space: nowrap; }
    #{{ viz_id }} .bfv-edge { fill: none; stroke: #64748b; stroke-width: 2.2; }
    #{{ viz_id }} .bfv-edge-updated { stroke: #2563eb; stroke-width: 4; }
    #{{ viz_id }} .bfv-edge-negative { stroke: #dc2626; stroke-width: 4.5; }
    #{{ viz_id }} .bfv-edge-label-bg { fill: #ffffff; stroke: rgba(100,116,139,0.35); stroke-width: 1; }
    #{{ viz_id }} .bfv-edge-label { fill: #111827; font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    #{{ viz_id }} .bfv-node circle { fill: #f8fafc; stroke: #475569; stroke-width: 2.5; }
    #{{ viz_id }} .bfv-node-source circle { fill: #dbeafe; stroke: #2563eb; }
    #{{ viz_id }} .bfv-node-updated circle { fill: #fef3c7; stroke: #d97706; stroke-width: 3; }
    #{{ viz_id }} .bfv-node-negative circle { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    #{{ viz_id }} .bfv-node text { fill: #111827; font-family: Helvetica, Arial, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    #{{ viz_id }} .bfv-node-name { font-size: 17px; font-weight: 700; }
    #{{ viz_id }} .bfv-node-dist { font-size: 12px; font-weight: 600; }
    #{{ viz_id }} .bfv-legend { display: grid; gap: 0.35rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #ffffff; font-size: 0.9em; line-height: 1.55; }
    #{{ viz_id }} .bfv-legend-item { display: flex; gap: 0.55rem; align-items: center; }
    #{{ viz_id }} .bfv-swatch { width: 0.95rem; height: 0.95rem; border-radius: 999px; flex: 0 0 auto; border: 2px solid transparent; }
    #{{ viz_id }} .bfv-swatch-source { background: #dbeafe; border-color: #2563eb; }
    #{{ viz_id }} .bfv-swatch-updated { background: #fef3c7; border-color: #d97706; }
    #{{ viz_id }} .bfv-swatch-negative { background: #fee2e2; border-color: #dc2626; }
  </style>

  <div class="bfv-stack">
    <div class="bfv-controls-shell">
      <div class="bfv-controls">
        <button type="button" data-role="prev">Prev</button>
        <button type="button" data-role="next">Step</button>
        <button type="button" data-role="run">Run</button>
        <button type="button" data-role="reset">Reset</button>
        <span class="bfv-counter">Step <span data-role="counter"></span></span>
      </div>
    </div>
    <div class="bfv-graph" data-role="graph"></div>
    <div class="bfv-status" data-role="status"></div>
    <div class="bfv-info">
      <div class="bfv-line"><strong>Distances:</strong> <span data-role="distances"></span></div>
      <div class="bfv-line"><strong>Relaxed edges in this step:</strong> <span data-role="relaxed"></span></div>
    </div>
    <div class="bfv-legend">
      <div class="bfv-legend-item"><span class="bfv-swatch bfv-swatch-source"></span> Source vertex</div>
      <div class="bfv-legend-item"><span class="bfv-swatch bfv-swatch-updated"></span> Vertex updated during this full pass</div>
      <div class="bfv-legend-item"><span class="bfv-swatch bfv-swatch-negative"></span> Edge proving a reachable negative cycle</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;
      function byRole(name) { return root.querySelector('[data-role="' + name + '"]'); }
      function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function html(s) { return "<p>" + esc(s).replace(/`([^`]+)`/g,"<code>$1</code>") + "</p>"; }
      function has(a,x) { return a.indexOf(x) !== -1; }
      function copyDist(d) { var out = {}; vertices.forEach(function (v) { out[v] = d[v]; }); return out; }
      function edgeKey(e) { return e.u + "-" + e.v; }
      function edgeText(e) { return "(" + e.u + "," + e.v + "," + e.w + ")"; }
      function distText(x) { return Number.isFinite(x) ? String(x) : "INF"; }
      var svgNS = "http://www.w3.org/2000/svg";
      var inf = Infinity;
      var vertices = ["A","B","C","D","E"];
      var pos = { A:[85,170], B:[230,70], C:[395,170], D:[230,270], E:[560,170] };
      var edges = [
        { u:"A", v:"E", w:8, q:[320,42], label:[340,104] },
        { u:"A", v:"B", w:-6, label:[148,110] },
        { u:"A", v:"D", w:9, label:[148,230] },
        { u:"B", v:"C", w:-2, label:[322,126] },
        { u:"C", v:"D", w:5, q:[330,252], label:[333,252] },
        { u:"D", v:"C", w:-4, q:[315,188], label:[313,200] },
        { u:"A", v:"C", w:3, label:[240,160] },
        { u:"C", v:"E", w:-7, q:[480,125], label:[480,126] },
        { u:"E", v:"C", w:-13, q:[480,215], label:[480,215] }
      ];
      function formatEdges(keys) {
        if (!keys.length) return "<code>-</code>";
        return "<code>" + keys.map(function (k) {
          return edgeText(edges.filter(function (e) { return edgeKey(e) === k; })[0]);
        }).join(", ") + "</code>";
      }
      function formatDistances(d) {
        return "<code>" + vertices.map(function (v) { return v + ":" + distText(d[v]); }).join(", ") + "</code>";
      }
      function makeState(title, desc, d, relaxed, updated, negative) {
        return { title:title, desc:desc, dist:copyDist(d), relaxed:relaxed.slice(), updated:updated.slice(), negative:negative || null };
      }
      function buildStates() {
        var d = {};
        vertices.forEach(function (v) { d[v] = inf; });
        d.A = 0;
        var states = [makeState("Initialization", "Set `d(A)=0` and all other distances to `INF`.", d, [], [], null)];
        for (var pass = 1; pass <= vertices.length - 1; pass++) {
          var relaxed = [], updated = [];
          edges.forEach(function (e) {
            if (!Number.isFinite(d[e.u])) return;
            var cand = d[e.u] + e.w;
            if (cand < d[e.v]) {
              d[e.v] = cand;
              relaxed.push(edgeKey(e));
              if (!has(updated,e.v)) updated.push(e.v);
            }
          });
          states.push(makeState("After pass " + pass, "Perform one full pass over the edge list. Every highlighted edge relaxed its endpoint.", d, relaxed, updated, null));
        }
        var witness = null;
        edges.some(function (e) {
          if (Number.isFinite(d[e.u]) && d[e.u] + e.w < d[e.v]) { witness = e; return true; }
          return false;
        });
        if (witness) {
          var desc = "Even after `|V|-1` passes, `" + edgeText(witness) + "` can still decrease a distance: `" + distText(d[witness.u]) + " + " + witness.w + " < " + distText(d[witness.v]) + "`.";
          states.push(makeState("Negative cycle detected", desc, d, [edgeKey(witness)], [witness.v], edgeKey(witness)));
        }
        return states;
      }
      var states = buildStates(), index = 0, timer = null;
      function svgEl(name, attrs) {
        var el = document.createElementNS(svgNS,name);
        Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k,attrs[k]); });
        return el;
      }
      function shorten(a,b) {
        var dx = b[0]-a[0], dy = b[1]-a[1], len = Math.sqrt(dx*dx+dy*dy) || 1, r = 29;
        return [[a[0]+dx*r/len,a[1]+dy*r/len],[b[0]-dx*r/len,b[1]-dy*r/len]];
      }
      function edgePath(e) {
        var s = shorten(pos[e.u],pos[e.v]), a = s[0], b = s[1];
        if (e.q) return "M " + a[0] + " " + a[1] + " Q " + e.q[0] + " " + e.q[1] + " " + b[0] + " " + b[1];
        return "M " + a[0] + " " + a[1] + " L " + b[0] + " " + b[1];
      }
      function markerId(kind) { return root.id + "-arrow-" + kind; }
      function edgeKind(s,e) {
        var k = edgeKey(e);
        if (s.negative === k) return "negative";
        if (has(s.relaxed,k)) return "updated";
        return "normal";
      }
      function edgeClass(kind) {
        if (kind === "negative") return "bfv-edge bfv-edge-negative";
        if (kind === "updated") return "bfv-edge bfv-edge-updated";
        return "bfv-edge";
      }
      function nodeClass(s,v) {
        if (s.negative && has(s.updated,v)) return "bfv-node bfv-node-negative";
        if (has(s.updated,v)) return "bfv-node bfv-node-updated";
        if (v === "A") return "bfv-node bfv-node-source";
        return "bfv-node";
      }
      function appendMarker(defs, kind, color) {
        var marker = svgEl("marker", { id:markerId(kind), viewBox:"0 0 10 10", refX:"9", refY:"5", markerWidth:"7", markerHeight:"7", orient:"auto-start-reverse" });
        marker.appendChild(svgEl("path", { d:"M 0 0 L 10 5 L 0 10 z", fill:color }));
        defs.appendChild(marker);
      }
      function draw(s) {
        var target = byRole("graph");
        target.innerHTML = "";
        var svg = svgEl("svg", { viewBox:"0 0 650 340", role:"img", "aria-label":"Bellman-Ford algorithm visualizer" });
        var defs = svgEl("defs", {});
        appendMarker(defs,"normal","#64748b");
        appendMarker(defs,"updated","#2563eb");
        appendMarker(defs,"negative","#dc2626");
        svg.appendChild(defs);
        edges.forEach(function (e) {
          var kind = edgeKind(s,e);
          svg.appendChild(svgEl("path", { d:edgePath(e), class:edgeClass(kind), "marker-end":"url(#" + markerId(kind) + ")" }));
        });
        edges.forEach(function (e) {
          var p = e.label;
          svg.appendChild(svgEl("rect", { x:p[0]-18, y:p[1]-11, width:36, height:22, rx:5, ry:5, class:"bfv-edge-label-bg" }));
          var t = svgEl("text", { x:p[0], y:p[1], class:"bfv-edge-label" });
          t.textContent = String(e.w);
          svg.appendChild(t);
        });
        vertices.forEach(function (v) {
          var p = pos[v], g = svgEl("g", { class:nodeClass(s,v) });
          g.appendChild(svgEl("circle", { cx:p[0], cy:p[1], r:29 }));
          var name = svgEl("text", { x:p[0], y:p[1]-7, class:"bfv-node-name" });
          name.textContent = v;
          var d = svgEl("text", { x:p[0], y:p[1]+12, class:"bfv-node-dist" });
          d.textContent = distText(s.dist[v]);
          g.appendChild(name);
          g.appendChild(d);
          svg.appendChild(g);
        });
        target.appendChild(svg);
      }
      function render() {
        var s = states[index], last = states.length - 1;
        byRole("counter").textContent = index + " / " + last;
        byRole("status").innerHTML = html("Step " + index + ": " + s.title + ". " + s.desc);
        byRole("distances").innerHTML = formatDistances(s.dist);
        byRole("relaxed").innerHTML = formatEdges(s.relaxed);
        byRole("prev").disabled = index === 0;
        byRole("next").disabled = index === last;
        byRole("run").textContent = timer ? "Pause" : "Run";
        draw(s);
      }
      function stopRun() {
        if (timer) clearInterval(timer);
        timer = null;
        var button = byRole("run");
        if (button) button.textContent = "Run";
      }
      function stepForward() {
        if (index >= states.length - 1) {
          stopRun();
          return false;
        }
        index += 1;
        render();
        if (index >= states.length - 1) stopRun();
        return true;
      }
      function toggleRun() {
        if (timer) {
          stopRun();
          return;
        }
        if (index >= states.length - 1) {
          index = 0;
          render();
        }
        timer = setInterval(stepForward, 850);
        byRole("run").textContent = "Pause";
      }
      function start() {
        if (root.dataset.initialized === "true") return;
        root.dataset.initialized = "true";
        byRole("prev").addEventListener("click", function () { stopRun(); if (index > 0) { index -= 1; render(); } });
        byRole("next").addEventListener("click", function () { stopRun(); stepForward(); });
        byRole("run").addEventListener("click", toggleRun);
        byRole("reset").addEventListener("click", function () { stopRun(); index = 0; render(); });
        render();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once:true });
      else start();
    })();
  </script>
</div>
