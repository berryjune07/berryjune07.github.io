<div id="monotone-chain-visualizer" class="mcv-panel">
  <div class="mcv-toolbar">
    <button type="button" data-action="prev">Prev</button>
    <button type="button" data-action="step">Step</button>
    <button type="button" data-action="run">Run</button>
    <button type="button" data-action="reset">Reset</button>
    <button type="button" data-action="random">Random</button>
    <span class="mcv-status" data-role="status"></span>
  </div>
  <canvas aria-label="Monotone chain convex hull visualizer"></canvas>
</div>

<style>
  .mcv-panel {
    width: 100%;
    max-width: 760px;
    margin: 1.25rem auto;
    border: 1px solid #d8dee8;
    border-radius: 8px;
    background: #f8fafc;
    overflow: hidden;
  }

  .mcv-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.45rem;
    padding: 0.65rem;
    border-bottom: 1px solid #d8dee8;
    background: #eef3f8;
  }

  .mcv-toolbar button {
    border: 1px solid #b9c5d6;
    border-radius: 6px;
    background: #ffffff;
    color: #1f2937;
    font: inherit;
    font-size: 0.85rem;
    line-height: 1;
    padding: 0.45rem 0.65rem;
    cursor: pointer;
  }

  .mcv-toolbar button:hover {
    background: #e6edf5;
  }

  .mcv-status {
    margin-left: auto;
    color: #475569;
    font-size: 0.85rem;
    white-space: nowrap;
  }

  .mcv-panel canvas {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: #ffffff;
    cursor: crosshair;
  }
</style>

<script>
(() => {
  const root = document.getElementById("monotone-chain-visualizer");
  if (!root) return;

  const canvas = root.querySelector("canvas");
  const ctx = canvas.getContext("2d");
  const status = root.querySelector("[data-role='status']");
  const buttons = root.querySelectorAll("button[data-action]");

  let points = [
    {x: 12, y: 70}, {x: 18, y: 34}, {x: 28, y: 84}, {x: 37, y: 45},
    {x: 48, y: 67}, {x: 54, y: 23}, {x: 63, y: 80}, {x: 72, y: 38},
    {x: 83, y: 61}, {x: 88, y: 18}, {x: 35, y: 17}, {x: 68, y: 11}
  ];

  let states = [];
  let step = 0;
  let timer = null;
  let view = {scale: 1, ox: 0, oy: 0, h: 1};

  function cross(a, b, c) {
    return (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
  }

  function key(p) {
    return p.x.toFixed(3) + "," + p.y.toFixed(3);
  }

  function clone(p) {
    return p ? {x: p.x, y: p.y} : null;
  }

  function cloneChain(chain) {
    return chain.map(clone);
  }

  function sortedUnique() {
    const seen = new Set();
    return points.slice().sort((a, b) => a.x === b.x ? a.y - b.y : a.x - b.x).filter(p => {
      const k = key(p);
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function buildStates() {
    const sorted = sortedUnique();
    const lower = [];
    const upper = [];
    const next = [];

    const pushState = (phase, candidate, removed, hull) => {
      next.push({
        phase,
        candidate: clone(candidate),
        removed: clone(removed),
        lower: cloneChain(lower),
        upper: cloneChain(upper),
        hull: hull ? cloneChain(hull) : null
      });
    };

    pushState("lexicographic sort", null, null, null);
    for (const p of sorted) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) {
        const removed = lower[lower.length - 1];
        pushState("lower pop", p, removed, null);
        lower.pop();
      }
      lower.push(p);
      pushState("lower push", p, null, null);
    }

    for (let i = sorted.length - 1; i >= 0; i--) {
      const p = sorted[i];
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) {
        const removed = upper[upper.length - 1];
        pushState("upper pop", p, removed, null);
        upper.pop();
      }
      upper.push(p);
      pushState("upper push", p, null, null);
    }

    const hull = lower.slice(0, -1).concat(upper.slice(0, -1));
    pushState("hull", null, null, hull);
    states = next;
    step = Math.min(step, states.length - 1);
  }

  function fitCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.floor(rect.width * ratio));
    canvas.height = Math.max(1, Math.floor(rect.height * ratio));
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    draw();
  }

  function computeView(all) {
    const rect = canvas.getBoundingClientRect();
    const pad = 30;
    const minX = Math.min(...all.map(p => p.x));
    const maxX = Math.max(...all.map(p => p.x));
    const minY = Math.min(...all.map(p => p.y));
    const maxY = Math.max(...all.map(p => p.y));
    const w = Math.max(1, maxX - minX);
    const h = Math.max(1, maxY - minY);
    const scale = Math.min((rect.width - 2 * pad) / w, (rect.height - 2 * pad) / h);
    view = {
      scale,
      ox: pad - minX * scale + ((rect.width - 2 * pad) - w * scale) / 2,
      oy: pad - minY * scale + ((rect.height - 2 * pad) - h * scale) / 2,
      h: rect.height
    };
  }

  function sx(p) { return view.ox + p.x * view.scale; }
  function sy(p) { return view.h - (view.oy + p.y * view.scale); }

  function worldFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, (event.clientX - rect.left - view.ox) / view.scale)),
      y: Math.max(0, Math.min(100, ((rect.height - (event.clientY - rect.top)) - view.oy) / view.scale))
    };
  }

  function drawPoint(p, fill, radius) {
    ctx.beginPath();
    ctx.arc(sx(p), sy(p), radius, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }

  function drawChain(chain, color, width, close) {
    if (!chain || !chain.length) return;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(sx(chain[0]), sy(chain[0]));
    for (let i = 1; i < chain.length; i++) ctx.lineTo(sx(chain[i]), sy(chain[i]));
    if (close && chain.length > 2) ctx.closePath();
    ctx.stroke();
  }

  function draw() {
    if (!states.length) buildStates();
    const state = states[step];
    const rect = canvas.getBoundingClientRect();
    computeView(points);
    ctx.clearRect(0, 0, rect.width, rect.height);

    for (const p of points) drawPoint(p, "#64748b", 4.1);
    drawChain(state.lower, "#059669", 3, false);
    drawChain(state.upper, "#d97706", 3, false);
    if (state.hull) drawChain(state.hull, "#0f172a", 3.5, true);
    if (state.removed) drawPoint(state.removed, "#dc2626", 6);
    if (state.candidate) drawPoint(state.candidate, "#2563eb", 6);

    status.textContent = (step + 1) + " / " + states.length + "  " + state.phase;
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  function rebuild() {
    stop();
    buildStates();
    step = 0;
    draw();
  }

  function randomPoints() {
    points = Array.from({length: 14}, () => ({
      x: 8 + Math.random() * 84,
      y: 8 + Math.random() * 84
    }));
    rebuild();
  }

  buttons.forEach(button => {
    button.addEventListener("click", () => {
      const action = button.dataset.action;
      if (action === "prev") {
        stop();
        step = Math.max(0, step - 1);
      } else if (action === "step") {
        stop();
        step = Math.min(states.length - 1, step + 1);
      } else if (action === "run") {
        if (timer) stop();
        else {
          timer = setInterval(() => {
            if (step >= states.length - 1) stop();
            else {
              step++;
              draw();
            }
          }, 540);
        }
      } else if (action === "reset") {
        rebuild();
        return;
      } else if (action === "random") {
        randomPoints();
        return;
      }
      draw();
    });
  });

  canvas.addEventListener("click", event => {
    points.push(worldFromEvent(event));
    rebuild();
  });

  buildStates();
  new ResizeObserver(fitCanvas).observe(canvas);
  fitCanvas();
})();
</script>
