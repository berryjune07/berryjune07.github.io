{% assign viz_id = include.id | default: "lazy-propagation-demo" %}
<div id="{{ viz_id }}" class="lpv-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 780px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .lpv-stack { display: grid; gap: 0; }
    #{{ viz_id }} .lpv-graph { width: 100%; padding: 0.75rem; background: #ffffff; overflow: hidden; }
    #{{ viz_id }} .lpv-graph svg { display: block; width: 100%; max-width: 780px; height: auto; margin: 0 auto; }
    #{{ viz_id }} .lpv-status-text { margin: 0; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #f8fafc; color: #1f2937; line-height: 1.65; }
    #{{ viz_id }} .lpv-status-text p { margin: 0; }
    #{{ viz_id }} .lpv-status-text code { padding: 0.08rem 0.38rem; border-radius: 0.35rem; background: rgba(148,163,184,0.14); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.94em; }
    #{{ viz_id }} .lpv-controls-shell { padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} .lpv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
    #{{ viz_id }} .lpv-controls > * { flex: 0 0 auto; margin: 0; vertical-align: middle; }
    #{{ viz_id }} .lpv-controls input[type="number"], #{{ viz_id }} .lpv-controls button { min-height: 2rem; border-radius: 6px; font: inherit; font-size: 0.85rem; line-height: 1; box-sizing: border-box; }
    #{{ viz_id }} .lpv-controls input[type="number"] { width: 4.6rem; min-width: 0; border: 1px solid #b9c5d6; background: #fff; color: #1f2937; padding: 0 0.5rem; outline: none; appearance: textfield; }
    #{{ viz_id }} .lpv-controls input[type="number"]:focus { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,0.18); }
    #{{ viz_id }} .lpv-controls button { appearance: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #b9c5d6; background: #ffffff; color: #1f2937; padding: 0.45rem 0.65rem; cursor: pointer; white-space: nowrap; }
    #{{ viz_id }} .lpv-controls button:hover { background: #e6edf5; }
    #{{ viz_id }} .lpv-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .lpv-edge { stroke: #64748b; stroke-width: 2; }
    #{{ viz_id }} .lpv-node rect { fill: #f8fafc; stroke: #475569; stroke-width: 2; rx: 7; ry: 7; }
    #{{ viz_id }} .lpv-node-touched rect { fill: #fef3c7; stroke: #d97706; stroke-width: 2.2; }
    #{{ viz_id }} .lpv-node-selected rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.5; }
    #{{ viz_id }} .lpv-node-current rect { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
    #{{ viz_id }} .lpv-node text,
    #{{ viz_id }} .lpv-array-cell text { fill: #111827; font-family: Helvetica, Arial, sans-serif; text-anchor: middle; pointer-events: none; }
    #{{ viz_id }} .lpv-node .lpv-node-index { font-size: 12px; font-weight: 700; }
    #{{ viz_id }} .lpv-node .lpv-node-interval { font-size: 11px; }
    #{{ viz_id }} .lpv-node .lpv-node-value { font-size: 11px; }
    #{{ viz_id }} .lpv-array-cell rect { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.6; rx: 5; ry: 5; }
    #{{ viz_id }} .lpv-array-cell-update rect { fill: #fee2e2; stroke: #dc2626; stroke-width: 2.2; }
    #{{ viz_id }} .lpv-array-cell-query rect { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
    #{{ viz_id }} .lpv-array-cell .lpv-array-value { font-size: 14px; font-weight: 700; dominant-baseline: central; }
    #{{ viz_id }} .lpv-array-cell .lpv-array-index { font-size: 11px; dominant-baseline: central; opacity: 0.8; }
    #{{ viz_id }} .lpv-legend { display: grid; gap: 0.35rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #ffffff; font-size: 0.9em; line-height: 1.55; }
    #{{ viz_id }} .lpv-legend-item { display: flex; gap: 0.55rem; align-items: center; }
    #{{ viz_id }} .lpv-swatch { width: 0.95rem; height: 0.95rem; border-radius: 999px; flex: 0 0 auto; border: 2px solid transparent; }
    #{{ viz_id }} .lpv-swatch-current { background: #fee2e2; border-color: #dc2626; }
    #{{ viz_id }} .lpv-swatch-selected { background: #dbeafe; border-color: #2563eb; }
    #{{ viz_id }} .lpv-swatch-touched { background: #fef3c7; border-color: #d97706; }
    #{{ viz_id }} .lpv-swatch-normal { background: #f8fafc; border-color: #475569; }
  </style>

  <div class="lpv-stack">
    <div class="lpv-controls-shell">
      <div class="lpv-controls">
        <input type="number" min="1" max="8" step="1" value="2" aria-label="Update left endpoint" title="Update left endpoint" data-role="update-left">
        <input type="number" min="1" max="8" step="1" value="4" aria-label="Update right endpoint" title="Update right endpoint" data-role="update-right">
        <input type="number" min="-9" max="9" step="1" value="1" aria-label="Add value" title="Add value" data-role="update-delta">
        <button type="button" data-role="update-btn">Add</button>
        <input type="number" min="1" max="8" step="1" value="3" aria-label="Query left endpoint" title="Query left endpoint" data-role="query-left">
        <input type="number" min="1" max="8" step="1" value="4" aria-label="Query right endpoint" title="Query right endpoint" data-role="query-right">
        <button type="button" data-role="query-btn">Query</button>
        <button type="button" data-role="undo-btn">Undo</button>
        <button type="button" data-role="reset-btn">Reset</button>
      </div>
    </div>
    <div class="lpv-graph" data-role="graph"></div>
    <div class="lpv-status-text" data-role="status-text"></div>
    <div class="lpv-legend">
      <div class="lpv-legend-item"><span class="lpv-swatch lpv-swatch-current"></span> Node whose lazy value was propagated</div>
      <div class="lpv-legend-item"><span class="lpv-swatch lpv-swatch-selected"></span> Fully covered update node or query cover node</div>
      <div class="lpv-legend-item"><span class="lpv-swatch lpv-swatch-touched"></span> Recursive call touched by the operation</div>
      <div class="lpv-legend-item"><span class="lpv-swatch lpv-swatch-normal"></span> Node not touched by the last operation</div>
      <div class="lpv-legend-item"><span style="color:#64748b;font-weight:700;">-</span> Parent-to-child relation</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;

      function byRole(name) {
        return root.querySelector('[data-role="' + name + '"]');
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function html(s) {
        return "<p>" + esc(s).replace(/`([^`]+)`/g, "<code>$1</code>") + "</p>";
      }

      function addUnique(arr, x) {
        if (arr.indexOf(x) === -1) arr.push(x);
      }

      function contains(arr, x) {
        return arr.indexOf(x) !== -1;
      }

      function copyArray(arr) {
        return arr.slice();
      }

      function copyObject(obj) {
        var out = {};
        Object.keys(obj).forEach(function (k) { out[k] = obj[k]; });
        return out;
      }

      var svgNS = "http://www.w3.org/2000/svg";
      var N = 8;
      var initialArray = [0, 1, 1, 1, 1, 1, 1, 1, 1];
      var nodes = [
        { id: 1, l: 1, r: 8, x: 390, y: 34 },
        { id: 2, l: 1, r: 4, x: 200, y: 112 },
        { id: 3, l: 5, r: 8, x: 580, y: 112 },
        { id: 4, l: 1, r: 2, x: 105, y: 190 },
        { id: 5, l: 3, r: 4, x: 295, y: 190 },
        { id: 6, l: 5, r: 6, x: 485, y: 190 },
        { id: 7, l: 7, r: 8, x: 675, y: 190 },
        { id: 8, l: 1, r: 1, x: 60, y: 268 },
        { id: 9, l: 2, r: 2, x: 150, y: 268 },
        { id: 10, l: 3, r: 3, x: 250, y: 268 },
        { id: 11, l: 4, r: 4, x: 340, y: 268 },
        { id: 12, l: 5, r: 5, x: 440, y: 268 },
        { id: 13, l: 6, r: 6, x: 530, y: 268 },
        { id: 14, l: 7, r: 7, x: 630, y: 268 },
        { id: 15, l: 8, r: 8, x: 720, y: 268 }
      ];
      var edges = [
        [1, 2], [1, 3],
        [2, 4], [2, 5], [3, 6], [3, 7],
        [4, 8], [4, 9], [5, 10], [5, 11], [6, 12], [6, 13], [7, 14], [7, 15]
      ];
      var byId = {};
      var leafByIndex = {};
      nodes.forEach(function (n) {
        byId[n.id] = n;
        if (n.l === n.r) leafByIndex[n.l] = n.id;
      });

      function interval(n) {
        return n.l === n.r ? "[" + n.l + "]" : "[" + n.l + ":" + n.r + "]";
      }

      function nodeText(id) {
        var n = byId[id];
        return id + "/" + interval(n);
      }

      function nodeList(ids) {
        if (!ids.length) return "-";
        return ids.map(nodeText).join(", ");
      }

      function arrayText(arr) {
        return "[" + arr.slice(1).join(", ") + "]";
      }

      function buildTree(arr) {
        var tree = {};
        function build(id, l, r) {
          if (l === r) {
            tree[id] = arr[l];
            return tree[id];
          }
          var m = Math.floor((l + r) / 2);
          tree[id] = build(id * 2, l, m) + build(id * 2 + 1, m + 1, r);
          return tree[id];
        }
        build(1, 1, N);
        return tree;
      }

      function emptyLazy() {
        var lazy = {};
        nodes.forEach(function (n) { lazy[n.id] = 0; });
        return lazy;
      }

      function copyState(s) {
        return {
          arr: copyArray(s.arr),
          tree: copyObject(s.tree),
          lazy: copyObject(s.lazy),
          current: copyArray(s.current),
          selected: copyArray(s.selected),
          touched: copyArray(s.touched),
          focus: {
            updateLeft: s.focus.updateLeft || null,
            updateRight: s.focus.updateRight || null,
            queryLeft: s.focus.queryLeft || null,
            queryRight: s.focus.queryRight || null
          },
          status: s.status
        };
      }

      function initial() {
        var arr = copyArray(initialArray);
        return {
          arr: arr,
          tree: buildTree(arr),
          lazy: emptyLazy(),
          current: [],
          selected: [],
          touched: [],
          focus: {},
          status: "The tree stores range sums over `A = " + arrayText(arr) + "`. Each node also stores a lazy addition value."
        };
      }

      function clearHighlights(s) {
        s.current = [];
        s.selected = [];
        s.touched = [];
        s.focus = {};
      }

      function readInt(role, min, max, name) {
        var input = byRole(role);
        var value = Number(input.value);
        if (!Number.isInteger(value) || value < min || value > max) {
          input.focus();
          throw new Error(name + " must be an integer from `" + min + "` to `" + max + "`.");
        }
        return value;
      }

      function applyNode(s, id, delta) {
        var n = byId[id];
        s.tree[id] += (n.r - n.l + 1) * delta;
        s.lazy[id] += delta;
      }

      function push(s, id, pushed) {
        var n = byId[id];
        var delta = s.lazy[id];
        if (!delta || n.l === n.r) return;
        applyNode(s, id * 2, delta);
        applyNode(s, id * 2 + 1, delta);
        s.lazy[id] = 0;
        addUnique(pushed, id);
      }

      function pull(s, id) {
        s.tree[id] = s.tree[id * 2] + s.tree[id * 2 + 1];
      }

      function updateNode(s, id, ql, qr, delta, updated, touched, pushed) {
        var n = byId[id];
        addUnique(touched, id);
        if (qr < n.l || n.r < ql) return;
        if (ql <= n.l && n.r <= qr) {
          applyNode(s, id, delta);
          addUnique(updated, id);
          return;
        }
        push(s, id, pushed);
        updateNode(s, id * 2, ql, qr, delta, updated, touched, pushed);
        updateNode(s, id * 2 + 1, ql, qr, delta, updated, touched, pushed);
        pull(s, id);
      }

      function queryNode(s, id, ql, qr, cover, touched, pushed) {
        var n = byId[id];
        addUnique(touched, id);
        if (qr < n.l || n.r < ql) return 0;
        if (ql <= n.l && n.r <= qr) {
          addUnique(cover, id);
          return s.tree[id];
        }
        push(s, id, pushed);
        return queryNode(s, id * 2, ql, qr, cover, touched, pushed) + queryNode(s, id * 2 + 1, ql, qr, cover, touched, pushed);
      }

      function doUpdate(prev, left, right, delta) {
        if (left > right) throw new Error("The left endpoint must be at most the right endpoint.");
        var s = copyState(prev);
        clearHighlights(s);
        var updated = [];
        var touched = [];
        var pushed = [];
        updateNode(s, 1, left, right, delta, updated, touched, pushed);
        for (var i = left; i <= right; i += 1) s.arr[i] += delta;
        s.current = pushed;
        s.selected = updated;
        s.touched = touched;
        s.focus.updateLeft = left;
        s.focus.updateRight = right;
        s.status = "`add(" + left + ", " + right + ", " + delta + ")` applied the update to nodes `" + nodeList(updated) + "`."
          + (pushed.length ? " Propagated lazy values from `" + nodeList(pushed) + "`." : "");
        return s;
      }

      function doQuery(prev, left, right) {
        if (left > right) throw new Error("The left endpoint must be at most the right endpoint.");
        var s = copyState(prev);
        clearHighlights(s);
        var cover = [];
        var touched = [];
        var pushed = [];
        var result = queryNode(s, 1, left, right, cover, touched, pushed);
        s.current = pushed;
        s.selected = cover;
        s.touched = touched;
        s.focus.queryLeft = left;
        s.focus.queryRight = right;
        s.status = "`query(" + left + ", " + right + ") = " + result + "`. Canonical cover nodes are `" + nodeList(cover) + "`."
          + (pushed.length ? " Propagated lazy values from `" + nodeList(pushed) + "`." : "");
        return s;
      }

      function svgEl(name, attrs) {
        var el = document.createElementNS(svgNS, name);
        Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
        return el;
      }

      function nodeClass(s, id) {
        if (contains(s.current, id)) return "lpv-node lpv-node-current";
        if (contains(s.selected, id)) return "lpv-node lpv-node-selected";
        if (contains(s.touched, id)) return "lpv-node lpv-node-touched";
        return "lpv-node";
      }

      function drawNode(svg, s, n) {
        var g = svgEl("g", { class: nodeClass(s, n.id) });
        g.appendChild(svgEl("rect", { x: n.x - 44, y: n.y - 31, width: 88, height: 62, rx: 7, ry: 7 }));
        var t1 = svgEl("text", { x: n.x, y: n.y - 18, class: "lpv-node-index" });
        t1.textContent = String(n.id);
        var t2 = svgEl("text", { x: n.x, y: n.y - 2, class: "lpv-node-interval" });
        t2.textContent = interval(n);
        var t3 = svgEl("text", { x: n.x, y: n.y + 13, class: "lpv-node-value" });
        t3.textContent = "sum=" + s.tree[n.id];
        var t4 = svgEl("text", { x: n.x, y: n.y + 27, class: "lpv-node-value" });
        t4.textContent = "lazy=" + s.lazy[n.id];
        g.appendChild(t1);
        g.appendChild(t2);
        g.appendChild(t3);
        g.appendChild(t4);
        svg.appendChild(g);
      }

      function cellClass(s, i) {
        if (s.focus.updateLeft && s.focus.updateLeft <= i && i <= s.focus.updateRight) return "lpv-array-cell lpv-array-cell-update";
        if (s.focus.queryLeft && s.focus.queryLeft <= i && i <= s.focus.queryRight) return "lpv-array-cell lpv-array-cell-query";
        return "lpv-array-cell";
      }

      function drawArray(svg, s) {
        var y = 390;
        for (var i = 1; i <= N; i += 1) {
          var x = byId[leafByIndex[i]].x;
          var g = svgEl("g", { class: cellClass(s, i) });
          g.appendChild(svgEl("rect", { x: x - 27, y: y - 20, width: 54, height: 40, rx: 5, ry: 5 }));
          var val = svgEl("text", { x: x, y: y - 6, class: "lpv-array-value" });
          val.textContent = String(s.arr[i]);
          var idx = svgEl("text", { x: x, y: y + 13, class: "lpv-array-index" });
          idx.textContent = "A" + i;
          g.appendChild(val);
          g.appendChild(idx);
          svg.appendChild(g);
        }
      }

      function draw(s) {
        var target = byRole("graph");
        target.innerHTML = "";
        var svg = svgEl("svg", { viewBox: "0 0 780 445", role: "img", "aria-label": "Lazy propagation segment tree" });
        edges.forEach(function (e) {
          var a = byId[e[0]];
          var b = byId[e[1]];
          svg.appendChild(svgEl("line", {
            x1: a.x, y1: a.y + 31,
            x2: b.x, y2: b.y - 31,
            class: "lpv-edge",
            "stroke-linecap": "round"
          }));
        });
        nodes.forEach(function (n) { drawNode(svg, s, n); });
        drawArray(svg, s);
        target.appendChild(svg);
      }

      function render() {
        var s = history[history.length - 1];
        byRole("status-text").innerHTML = html(s.status);
        byRole("undo-btn").disabled = history.length <= 1;
        draw(s);
      }

      function commit(s) {
        history.push(s);
        render();
      }

      function handle(f) {
        try {
          commit(f(history[history.length - 1]));
        } catch (e) {
          var s = copyState(history[history.length - 1]);
          clearHighlights(s);
          s.status = e && e.message ? e.message : "The operation could not be applied.";
          byRole("status-text").innerHTML = html(s.status);
          draw(s);
        }
      }

      function start() {
        if (root.dataset.initialized === "true") return;
        root.dataset.initialized = "true";
        history = [initial()];
        render();
        byRole("update-btn").addEventListener("click", function () {
          handle(function (s) {
            return doUpdate(
              s,
              readInt("update-left", 1, N, "Update left endpoint"),
              readInt("update-right", 1, N, "Update right endpoint"),
              readInt("update-delta", -9, 9, "Added value")
            );
          });
        });
        byRole("query-btn").addEventListener("click", function () {
          handle(function (s) {
            return doQuery(
              s,
              readInt("query-left", 1, N, "Query left endpoint"),
              readInt("query-right", 1, N, "Query right endpoint")
            );
          });
        });
        byRole("undo-btn").addEventListener("click", function () {
          if (history.length > 1) {
            history.pop();
            render();
          }
        });
        byRole("reset-btn").addEventListener("click", function () {
          history = [initial()];
          render();
        });
      }

      var history = [];
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, { once: true });
      } else {
        start();
      }
    })();
  </script>
</div>
