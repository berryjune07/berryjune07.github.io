{% assign viz_id = include.id | default: "disjoint-set-demo" %}
<div id="{{ viz_id }}" class="dsv-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 760px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .dsv-stack { display: grid; gap: 0; }
    #{{ viz_id }} .dsv-graph { width: 100%; padding: 0.75rem; background: #ffffff; overflow: hidden; }
    #{{ viz_id }} .dsv-graph svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    #{{ viz_id }} .dsv-status-text { margin: 0; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #f8fafc; color: #1f2937; line-height: 1.65; }
    #{{ viz_id }} .dsv-status-text p { margin: 0; }
    #{{ viz_id }} .dsv-status-text code { padding: 0.08rem 0.38rem; border-radius: 0.35rem; background: rgba(148,163,184,0.14); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.94em; }
    #{{ viz_id }} .dsv-controls-shell { padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} .dsv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
    #{{ viz_id }} .dsv-controls > * { flex: 0 0 auto; margin: 0; vertical-align: middle; }
    #{{ viz_id }} .dsv-controls input[type="number"], #{{ viz_id }} .dsv-controls button { min-height: 2rem; border-radius: 6px; font: inherit; font-size: 0.85rem; line-height: 1; box-sizing: border-box; }
    #{{ viz_id }} .dsv-controls input[type="number"] { width: 4.6rem; min-width: 0; border: 1px solid #b9c5d6; background: #fff; color: #1f2937; padding: 0 0.5rem; outline: none; appearance: textfield; }
    #{{ viz_id }} .dsv-controls input[type="number"]:focus { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,0.18); }
    #{{ viz_id }} .dsv-controls button { appearance: none; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #b9c5d6; background: #ffffff; color: #1f2937; padding: 0.45rem 0.65rem; cursor: pointer; white-space: nowrap; }
    #{{ viz_id }} .dsv-controls button:hover { background: #e6edf5; }
    #{{ viz_id }} .dsv-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .dsv-legend { display: grid; gap: 0.35rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #ffffff; font-size: 0.9em; line-height: 1.55; }
    #{{ viz_id }} .dsv-legend-item { display: flex; gap: 0.55rem; align-items: center; }
    #{{ viz_id }} .dsv-swatch { width: 0.95rem; height: 0.95rem; border-radius: 999px; flex: 0 0 auto; border: 2px solid transparent; }
    #{{ viz_id }} .dsv-swatch-root { background: #dbeafe; border-color: #2563eb; }
    #{{ viz_id }} .dsv-swatch-touched { background: #fef3c7; border-color: #d97706; }
    #{{ viz_id }} .dsv-swatch-current { background: #fee2e2; border-color: #dc2626; }
    #{{ viz_id }} .dsv-swatch-normal { background: #f8fafc; border-color: #475569; }
  </style>

  <div class="dsv-stack">
    <div class="dsv-controls-shell">
      <div class="dsv-controls">
        <input type="number" min="1" max="6" step="1" value="1" aria-label="Union first node" data-role="union-a">
        <input type="number" min="1" max="6" step="1" value="2" aria-label="Union second node" data-role="union-b">
        <button type="button" data-role="union-btn">Union</button>
        <input type="number" min="1" max="6" step="1" value="1" aria-label="Find node" data-role="find-x">
        <button type="button" data-role="find-btn">Find</button>
        <button type="button" data-role="undo-btn">Undo</button>
        <button type="button" data-role="reset-btn">Reset</button>
      </div>
    </div>
    <div class="dsv-graph" data-role="graph"></div>
    <div class="dsv-status-text" data-role="status-text"></div>
    <div class="dsv-legend">
      <div class="dsv-legend-item"><span class="dsv-swatch dsv-swatch-current"></span> Current node in the active operation</div>
      <div class="dsv-legend-item"><span class="dsv-swatch dsv-swatch-root"></span> Root selected after union or find</div>
      <div class="dsv-legend-item"><span class="dsv-swatch dsv-swatch-touched"></span> Node touched by path compression or merge</div>
      <div class="dsv-legend-item"><span class="dsv-swatch dsv-swatch-normal"></span> Node with no highlight in the current step</div>
      <div class="dsv-legend-item"><span style="color:#64748b;font-weight:700;">━</span> Parent-to-child pointer</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;
      function byRole(name) { return root.querySelector('[data-role="' + name + '"]'); }
      function getViz() {
        if (window.__graphvizVizPromise) return window.__graphvizVizPromise;
        window.__graphvizVizPromise = new Promise(function (resolve, reject) {
          function ready() {
            if (window.Viz && window.Viz.instance) { window.Viz.instance().then(resolve).catch(reject); return true; }
            return false;
          }
          if (ready()) return;
          var script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/@viz-js/viz@3/lib/viz-standalone.js";
          script.async = true;
          script.onload = function () { if (!ready()) reject(new Error("Viz.js did not expose Viz.instance.")); };
          script.onerror = function () { reject(new Error("Failed to load Viz.js.")); };
          document.head.appendChild(script);
        });
        return window.__graphvizVizPromise;
      }
      function html(s) { return "<p>" + String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/`([^`]+)`/g,"<code>$1</code>") + "</p>"; }
      function quote(s) { return '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n") + '"'; }
      function addUnique(a,x) { if (a.indexOf(x) === -1) a.push(x); }
      var nodes = [1,2,3,4,5,6];
      function initial() {
        var parent = {}, rank = {};
        nodes.forEach(function(n){ parent[n] = n; rank[n] = 0; });
        return { parent: parent, rank: rank, current: [], roots: nodes.slice(), touched: [], status: "Each node starts in its own set. Use `Union` or `Find` to update the forest." };
      }
      function copy(s) {
        return { parent: Object.assign({}, s.parent), rank: Object.assign({}, s.rank), current: s.current.slice(), roots: s.roots.slice(), touched: s.touched.slice(), status: s.status };
      }
      function clear(s) { s.current = []; s.roots = []; s.touched = []; }
      function read(role) {
        var input = byRole(role), value = Number(input.value);
        if (!Number.isInteger(value) || value < 1 || value > 6) { input.focus(); throw new Error("Please enter an integer from `1` to `6`."); }
        return value;
      }
      function findRoot(s, x, touched) {
        var path = [], cur = x;
        while (s.parent[cur] !== cur) { path.push(cur); cur = s.parent[cur]; }
        path.forEach(function(v){ s.parent[v] = cur; addUnique(touched, v); });
        addUnique(touched, cur);
        return { root: cur, path: path };
      }
      function pathText(path, rootNode) { return path.length ? path.join(" -> ") + " -> " + rootNode : String(rootNode); }
      function doFind(prev, x) {
        var s = copy(prev); clear(s); s.current = [x];
        var touched = [], r = findRoot(s, x, touched);
        s.roots = [r.root]; s.touched = touched;
        s.status = "`find(" + x + ")` reached root `" + r.root + "` along `" + pathText(r.path, r.root) + "`.";
        return s;
      }
      function doUnion(prev, a, b) {
        var s = copy(prev); clear(s); s.current = [a,b];
        var touched = [], left = findRoot(s, a, touched), right = findRoot(s, b, touched);
        if (left.root === right.root) { s.roots = [left.root]; s.touched = touched; s.status = "`union(" + a + ", " + b + ")` found the same root `" + left.root + "`. No merge was needed."; return s; }
        var rootNode = left.root, child = right.root;
        if (s.rank[left.root] < s.rank[right.root]) { rootNode = right.root; child = left.root; }
        s.parent[child] = rootNode; addUnique(touched, rootNode); addUnique(touched, child);
        var raised = false;
        if (s.rank[left.root] === s.rank[right.root]) { s.rank[rootNode] += 1; raised = true; }
        s.roots = [rootNode]; s.touched = touched;
        s.status = "`union(" + a + ", " + b + ")` attached root `" + child + "` under root `" + rootNode + "`" + (raised ? ". The ranks were equal, so the root rank increased." : ".");
        return s;
      }
      function kind(s, n) { if (s.current.indexOf(n) !== -1) return "current"; if (s.roots.indexOf(n) !== -1) return "root"; if (s.touched.indexOf(n) !== -1) return "touched"; return "normal"; }
      function dot(s) {
        var fill = { normal:"#f8fafc", root:"#dbeafe", touched:"#fef3c7", current:"#fee2e2" };
        var stroke = { normal:"#334155", root:"#2563eb", touched:"#d97706", current:"#dc2626" };
        var out = ['digraph DSU {', 'graph [rankdir=TB, bgcolor="transparent", margin="0.05", nodesep="0.45", ranksep="0.65"];', 'node [shape=circle, style="filled", fontname="Helvetica", fontsize="12", fixedsize=true, width="0.86"];', 'edge [color="#64748b", penwidth="1.5", arrowsize="0.7"];'];
        nodes.forEach(function(n){ var k = kind(s,n); out.push('N' + n + ' [label=' + quote(n + ":" + s.parent[n] + ":" + s.rank[n]) + ', fillcolor=' + quote(fill[k]) + ', color=' + quote(stroke[k]) + ', penwidth=' + (k === "current" ? '3' : '2') + '];'); });
        nodes.forEach(function(n){ if (s.parent[n] !== n) out.push('N' + s.parent[n] + ' -> N' + n + ';'); });
        out.push('}'); return out.join("\n");
      }
      function draw(s) { var target = byRole("graph"); target.innerHTML = ""; target.appendChild(viz.renderSVGElement(dot(s), { engine: "dot" })); }
      function render() { var s = history[history.length-1]; byRole("status-text").innerHTML = html(s.status); byRole("undo-btn").disabled = history.length <= 1; draw(s); }
      function commit(s) { history.push(s); render(); }
      function handle(f) { try { commit(f(history[history.length-1])); } catch(e) { var s = copy(history[history.length-1]); clear(s); s.status = e && e.message ? e.message : "The operation could not be applied."; byRole("status-text").innerHTML = html(s.status); } }
      function start() {
        if (root.dataset.initialized === "true") return;
        root.dataset.initialized = "true";
        getViz().then(function(loadedViz){ viz = loadedViz; history = [initial()]; render();
          byRole("union-btn").addEventListener("click", function(){ handle(function(s){ return doUnion(s, read("union-a"), read("union-b")); }); });
          byRole("find-btn").addEventListener("click", function(){ handle(function(s){ return doFind(s, read("find-x")); }); });
          byRole("undo-btn").addEventListener("click", function(){ if (history.length > 1) { history.pop(); render(); } });
          byRole("reset-btn").addEventListener("click", function(){ history = [initial()]; render(); });
        }).catch(function(e){ byRole("status-text").innerHTML = html("Viz.js failed to load: " + (e && e.message ? e.message : "Unknown error.")); });
      }
      var viz = null, history = [];
      if (document.readyState === "complete") start(); else window.addEventListener("load", start, { once: true });
    })();
  </script>
</div>
