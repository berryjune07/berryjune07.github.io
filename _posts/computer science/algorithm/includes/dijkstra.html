{% assign viz_id = include.id | default: "dijkstra-demo" %}
<div id="{{ viz_id }}" class="dv-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 760px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .dv-controls { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; margin: 0; padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} .dv-controls button { appearance: none; min-height: 2rem; border: 1px solid #b9c5d6; background: #ffffff; color: #1f2937; padding: 0.45rem 0.65rem; border-radius: 6px; font: inherit; font-size: 0.85rem; line-height: 1; cursor: pointer; }
    #{{ viz_id }} .dv-controls button:hover { background: #e6edf5; }
    #{{ viz_id }} .dv-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .dv-counter { margin-left: auto; color: #475569; font-size: 0.85rem; white-space: nowrap; }
    #{{ viz_id }} .dv-graph { width: 100%; padding: 0.75rem; background: #ffffff; overflow: hidden; }
    #{{ viz_id }} .dv-graph svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
    #{{ viz_id }} .dv-divider { display: none; }
    #{{ viz_id }} .dv-step-title { margin: 0; padding: 0.75rem 0.85rem 0; border-top: 1px solid #d8dee8; font-size: 1em; font-weight: 700; }
    #{{ viz_id }} .dv-step-text { margin: 0; padding: 0.35rem 0.85rem 0.75rem; line-height: 1.65; }
    #{{ viz_id }} .dv-info-grid { display: grid; grid-template-columns: 1fr; gap: 0.65rem; margin: 0; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #ffffff; }
    #{{ viz_id }} .dv-info-block h4 { margin: 0 0 0.5rem 0; font-size: 1em; }
    #{{ viz_id }} .dv-math-line { min-height: 1.8rem; line-height: 1.8; overflow-x: auto; overflow-y: hidden; }
    #{{ viz_id }} .dv-legend { display: grid; gap: 0.35rem; margin-top: 0.25rem; font-size: 0.9em; line-height: 1.55; }
    #{{ viz_id }} .dv-legend-item { display: flex; gap: 0.55rem; align-items: center; }
    #{{ viz_id }} .dv-swatch { width: 0.95rem; height: 0.95rem; border-radius: 999px; flex: 0 0 auto; border: 2px solid transparent; }
    #{{ viz_id }} .dv-swatch-current { background: #fee2e2; border-color: #dc2626; }
    #{{ viz_id }} .dv-swatch-visited { background: #dbeafe; border-color: #2563eb; }
    #{{ viz_id }} .dv-swatch-frontier { background: #fef3c7; border-color: #d97706; }
    #{{ viz_id }} .dv-swatch-normal { background: #f8fafc; border-color: #475569; }
  </style>

  <div class="dv-controls">
    <button type="button" data-role="prev">Prev</button>
    <button type="button" data-role="next">Step</button>
    <button type="button" data-role="run">Run</button>
    <button type="button" data-role="reset">Reset</button>
    <span class="dv-counter">Step <span data-role="counter"></span></span>
  </div>
  <div class="dv-graph" data-role="graph"></div>
  <hr class="dv-divider">
  <div class="dv-step-title" data-role="step-title"></div>
  <p class="dv-step-text" data-role="step-desc"></p>
  <div class="dv-info-grid">
    <div class="dv-info-block"><h4>Priority queue</h4><div class="dv-math-line" data-role="pq-state"></div></div>
    <div class="dv-info-block"><h4>Legend</h4><div class="dv-legend">
      <div class="dv-legend-item"><span class="dv-swatch dv-swatch-current"></span> Current node being processed</div>
      <div class="dv-legend-item"><span class="dv-swatch dv-swatch-visited"></span> Node with finalized shortest distance</div>
      <div class="dv-legend-item"><span class="dv-swatch dv-swatch-frontier"></span> Node currently stored in the priority queue</div>
      <div class="dv-legend-item"><span class="dv-swatch dv-swatch-normal"></span> Unexplored node</div>
      <div class="dv-legend-item"><span style="color:#dc2626;font-weight:700;">━</span> Edge being relaxed in this step</div>
      <div class="dv-legend-item"><span style="color:#2563eb;font-weight:700;">━</span> Current shortest-path tree candidate</div>
    </div></div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;
      function byRole(name) { return root.querySelector('[data-role="' + name + '"]'); }
      function waitFor(check, timeout, step) {
        return new Promise(function (resolve, reject) {
          var start = Date.now();
          function tick() {
            var value = check();
            if (value) return resolve(value);
            if (Date.now() - start > timeout) return reject(new Error("Timed out while waiting for a required library."));
            setTimeout(tick, step);
          }
          tick();
        });
      }
      function getKatex() {
        return waitFor(function () { return window.katex && window.katex.renderToString ? window.katex : null; }, 8000, 50);
      }
      function getViz() {
        if (window.__graphvizVizPromise) return window.__graphvizVizPromise;
        window.__graphvizVizPromise = new Promise(function (resolve, reject) {
          function ready() {
            if (window.Viz && window.Viz.instance) {
              window.Viz.instance().then(resolve).catch(reject);
              return true;
            }
            return false;
          }
          if (ready()) return;
          var script = document.createElement("script");
          script.src = "https://cdn.jsdelivr.net/npm/@viz-js/viz@3/lib/viz-standalone.js";
          script.async = true;
          script.onload = function () { if (!ready()) reject(new Error("Viz.js did not expose Viz.instance.")); };
          script.onerror = function () { reject(new Error("Failed to load Viz.js.")); };
          document.head.appendChild(script);
        });
        return window.__graphvizVizPromise;
      }
      function h(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function q(s) { return '"' + String(s).replace(/\\/g,"\\\\").replace(/"/g,'\\"').replace(/\n/g,"\\n") + '"'; }
      function math(s) { return katex.renderToString(s, { throwOnError: false, output: "html" }); }
      function dist(x) { return Number.isFinite(x) ? String(x) : "\\infty"; }
      function pqTex(pq) {
        if (!pq.length) return "\\langle\\,\\rangle";
        return "\\left\\langle " + pq.slice().sort(function(a,b){ return a.dist-b.dist || a.node.localeCompare(b.node); }).map(function(x){ return "(" + x.node + "," + dist(x.dist) + ")"; }).join(",\\;") + " \\right\\rangle";
      }
      var nodes = ["A","B","C","D","E"];
      var edges = [["A","B",4],["A","C",2],["B","C",1],["B","D",5],["C","D",8],["C","E",10],["D","E",2]];
      var pos = { A:"0,1.7!", B:"1.8,2.4!", C:"1.8,0.8!", D:"3.8,2.0!", E:"4.2,0.6!" };
      var adj = {};
      nodes.forEach(function(n){ adj[n] = []; });
      edges.forEach(function(e){ adj[e[0]].push({node:e[1],weight:e[2]}); adj[e[1]].push({node:e[0],weight:e[2]}); });
      Object.keys(adj).forEach(function(n){ adj[n].sort(function(a,b){ return a.weight-b.weight || a.node.localeCompare(b.node); }); });
      function copyState(s) {
        var t = { dist:{}, parent:{}, visited:{}, pq:[], current:s.current, index:s.index, phase:s.phase, active:s.active ? [s.active[0],s.active[1]] : null, caption:s.caption, desc:s.desc, done:s.done };
        Object.keys(s.dist).forEach(function(k){ t.dist[k] = s.dist[k]; });
        Object.keys(s.parent).forEach(function(k){ t.parent[k] = s.parent[k]; });
        Object.keys(s.visited).forEach(function(k){ t.visited[k] = s.visited[k]; });
        s.pq.forEach(function(x){ t.pq.push({node:x.node, dist:x.dist}); });
        return t;
      }
      function initial() {
        var d = {}; nodes.forEach(function(n){ d[n] = Infinity; }); d.A = 0;
        return { dist:d, parent:{}, visited:{}, pq:[{node:"A",dist:0}], current:null, index:0, phase:"select", active:null, caption:"Initialization", desc:"Initialize Dijkstra's algorithm with source node `A`.", done:false };
      }
      function popMin(s) { s.pq.sort(function(a,b){ return a.dist-b.dist || a.node.localeCompare(b.node); }); return s.pq.shift(); }
      function putPQ(s,node,d) { for (var i=0;i<s.pq.length;i++) if (s.pq[i].node===node) { s.pq[i].dist=d; return; } s.pq.push({node:node,dist:d}); }
      function same(a,b,c,d) { return (a===c && b===d) || (a===d && b===c); }
      function treeEdge(s,u,v) { return Object.keys(s.parent).some(function(x){ return same(s.parent[x], x, u, v); }); }
      function nodeKind(s,n) { if (s.current===n) return "current"; if (s.visited[n]) return "visited"; if (s.pq.some(function(x){ return x.node===n; })) return "frontier"; return "normal"; }
      function next(s) {
        var t = copyState(s); t.active = null;
        if (t.done) return t;
        if (t.phase === "select") {
          if (!t.pq.length) { t.done = true; t.caption = "Finished"; t.desc = "The priority queue is empty, so the algorithm terminates."; return t; }
          var x = popMin(t); t.current = x.node; t.visited[x.node] = true; t.index = 0; t.phase = "relax";
          t.caption = "Extract minimum"; t.desc = "Remove `" + x.node + "` from the priority queue. Its shortest distance is now finalized."; return t;
        }
        var list = adj[t.current];
        if (t.index >= list.length) { var f = t.current; t.current = null; t.index = 0; t.phase = "select"; t.caption = "Finish processing node"; t.desc = "All outgoing edges of `" + f + "` have been examined."; return t; }
        var e = list[t.index++]; t.active = [t.current, e.node];
        if (t.visited[e.node]) { t.caption = "Skip finalized neighbor"; t.desc = "Inspect edge `(" + t.current + "," + e.node + ")`. The neighbor is already finalized."; return t; }
        var cand = t.dist[t.current] + e.weight;
        if (cand < t.dist[e.node]) { t.dist[e.node] = cand; t.parent[e.node] = t.current; putPQ(t,e.node,cand); t.caption = "Relax edge"; t.desc = "Inspect edge `(" + t.current + "," + e.node + ")`. The candidate distance improves the current value."; }
        else { t.caption = "Relax edge"; t.desc = "Inspect edge `(" + t.current + "," + e.node + ")`. The candidate distance is not smaller."; }
        return t;
      }
      function dot(s) {
        var fill = { normal:"#f8fafc", visited:"#dbeafe", frontier:"#fef3c7", current:"#fee2e2" };
        var stroke = { normal:"#334155", visited:"#2563eb", frontier:"#d97706", current:"#dc2626" };
        var out = ['graph G {', 'graph [layout=neato, overlap=false, splines=true, bgcolor="transparent", margin="0.05"];', 'node [shape=circle, style="filled", fontname="Helvetica", fontsize="12", fixedsize=true, width="0.78"];', 'edge [fontname="Helvetica", fontsize="11", color="#64748b", penwidth="1.5"];'];
        nodes.forEach(function(n){ var k = nodeKind(s,n); out.push(n + ' [label=' + q(n + "\n" + (Number.isFinite(s.dist[n]) ? s.dist[n] : "INF")) + ', pos=' + q(pos[n]) + ', fillcolor=' + q(fill[k]) + ', color=' + q(stroke[k]) + ', penwidth=' + (k === "current" ? '3' : '2') + '];'); });
        edges.forEach(function(e){ var color = "#64748b", pen = "1.5"; if (s.active && same(s.active[0],s.active[1],e[0],e[1])) { color = "#dc2626"; pen = "4"; } else if (treeEdge(s,e[0],e[1])) { color = "#2563eb"; pen = "3"; } out.push(e[0] + ' -- ' + e[1] + ' [label=' + q(String(e[2])) + ', color=' + q(color) + ', penwidth=' + q(pen) + '];'); });
        out.push('}'); return out.join("\n");
      }
      function draw(s) { var target = byRole("graph"); target.innerHTML = ""; target.appendChild(viz.renderSVGElement(dot(s), { engine: "neato" })); }
      function stopRun() {
        if (timer) clearInterval(timer);
        timer = null;
        var button = byRole("run");
        if (button) button.textContent = "Run";
      }
      function stepForward() {
        var s = history[history.length - 1];
        if (s.done) {
          stopRun();
          return false;
        }
        history.push(next(s));
        render();
        if (history[history.length - 1].done) stopRun();
        return true;
      }
      function toggleRun() {
        if (timer) {
          stopRun();
          return;
        }
        if (history.length && history[history.length - 1].done) {
          history = [initial()];
          render();
        }
        timer = setInterval(stepForward, 850);
        byRole("run").textContent = "Pause";
      }
      function render() {
        var s = history[history.length - 1];
        byRole("counter").textContent = String(history.length - 1);
        byRole("step-title").textContent = "Step " + (history.length - 1) + " - " + s.caption;
        byRole("step-desc").innerHTML = h(s.desc).replace(/`([^`]+)`/g, "<code>$1</code>");
        byRole("pq-state").innerHTML = math(pqTex(s.pq));
        root.querySelector('[data-role="prev"]').disabled = history.length <= 1;
        root.querySelector('[data-role="next"]').disabled = s.done;
        byRole("run").textContent = timer ? "Pause" : "Run";
        draw(s);
      }
      function start() {
        if (root.dataset.initialized === "true") return;
        root.dataset.initialized = "true";
        Promise.all([getKatex(), getViz()]).then(function(libs) {
          katex = libs[0];
          viz = libs[1];
          history = [initial()];
          render();
          root.querySelector('[data-role="prev"]').addEventListener("click", function() {
            stopRun();
            if (history.length > 1) {
              history.pop();
              render();
            }
          });
          root.querySelector('[data-role="next"]').addEventListener("click", function() {
            stopRun();
            stepForward();
          });
          root.querySelector('[data-role="run"]').addEventListener("click", toggleRun);
          root.querySelector('[data-role="reset"]').addEventListener("click", function() {
            stopRun();
            history = [initial()];
            render();
          });
        }).catch(function(err) {
          byRole("graph").textContent = err && err.message ? err.message : "Failed to initialize visualizer.";
        });
      }
      var katex = null, viz = null, history = [], timer = null;
      if (document.readyState === "complete") start(); else window.addEventListener("load", start, { once: true });
    })();
  </script>
</div>
