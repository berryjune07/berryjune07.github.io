{% assign viz_id = include.id | default: "mst-kruskal-demo" %}
<div id="{{ viz_id }}" class="mstkv-root">
  <style>
    #{{ viz_id }} { width: 100%; max-width: 760px; margin: 1.25rem auto; border: 1px solid #d8dee8; border-radius: 8px; background: #f8fafc; color: #1f2937; overflow: hidden; }
    #{{ viz_id }} * { box-sizing: border-box; }
    #{{ viz_id }} .mstkv-stack { display: grid; gap: 0; }
    #{{ viz_id }} .mstkv-graph { width: 100%; padding: 0.75rem; background: #ffffff; overflow: hidden; }
    #{{ viz_id }} .mstkv-graph svg { display: block; width: 100%; max-width: 620px; height: auto; margin: 0 auto; }
    #{{ viz_id }} .mstkv-status { margin: 0; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #f8fafc; line-height: 1.65; }
    #{{ viz_id }} .mstkv-status p { margin: 0; }
    #{{ viz_id }} code { padding: 0.08rem 0.38rem; border-radius: 0.35rem; background: rgba(148,163,184,0.14); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.94em; }
    #{{ viz_id }} .mstkv-controls-shell { padding: 0.65rem; border-bottom: 1px solid #d8dee8; background: #eef3f8; }
    #{{ viz_id }} .mstkv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.45rem; }
    #{{ viz_id }} .mstkv-controls button { appearance: none; display: inline-flex; align-items: center; justify-content: center; min-height: 2rem; border: 1px solid #b9c5d6; background: #ffffff; color: #1f2937; border-radius: 6px; padding: 0.45rem 0.65rem; font: inherit; font-size: 0.85rem; line-height: 1; cursor: pointer; white-space: nowrap; }
    #{{ viz_id }} .mstkv-controls button:hover { background: #e6edf5; }
    #{{ viz_id }} .mstkv-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    #{{ viz_id }} .mstkv-counter { margin-left: auto; color: #475569; font-size: 0.85rem; white-space: nowrap; }
    #{{ viz_id }} .mstkv-info { display: grid; gap: 0.45rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; line-height: 1.65; }
    #{{ viz_id }} .mstkv-line { overflow-x: auto; white-space: nowrap; }
    #{{ viz_id }} .mstkv-edge { stroke: #64748b; stroke-width: 2.2; }
    #{{ viz_id }} .mstkv-edge-tree { stroke: #2563eb; stroke-width: 4; }
    #{{ viz_id }} .mstkv-edge-current { stroke: #dc2626; stroke-width: 5; }
    #{{ viz_id }} .mstkv-edge-rejected { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 7 6; }
    #{{ viz_id }} .mstkv-edge-label-bg { fill: #ffffff; stroke: rgba(100,116,139,0.35); stroke-width: 1; }
    #{{ viz_id }} .mstkv-edge-label { fill: #111827; font-family: Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    #{{ viz_id }} .mstkv-node circle { fill: #f8fafc; stroke: #475569; stroke-width: 2.5; }
    #{{ viz_id }} .mstkv-node-current circle { fill: #fee2e2; stroke: #dc2626; stroke-width: 4; }
    #{{ viz_id }} .mstkv-node-selected circle { fill: #dbeafe; stroke: #2563eb; }
    #{{ viz_id }} .mstkv-node text { fill: #111827; font-family: Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    #{{ viz_id }} .mstkv-legend { display: grid; gap: 0.35rem; padding: 0.75rem 0.85rem; border-top: 1px solid #d8dee8; background: #ffffff; font-size: 0.9em; line-height: 1.55; }
    #{{ viz_id }} .mstkv-legend-item { display: flex; gap: 0.55rem; align-items: center; }
    #{{ viz_id }} .mstkv-swatch { width: 0.95rem; height: 0.95rem; border-radius: 999px; flex: 0 0 auto; border: 2px solid transparent; }
    #{{ viz_id }} .mstkv-swatch-current { background: #fee2e2; border-color: #dc2626; }
    #{{ viz_id }} .mstkv-swatch-tree { background: #dbeafe; border-color: #2563eb; }
    #{{ viz_id }} .mstkv-swatch-rejected { background: #f8fafc; border-color: #94a3b8; }
  </style>

  <div class="mstkv-stack">
    <div class="mstkv-controls-shell">
      <div class="mstkv-controls">
        <button type="button" data-role="prev">Prev</button>
        <button type="button" data-role="next">Step</button>
        <button type="button" data-role="run">Run</button>
        <button type="button" data-role="reset">Reset</button>
        <span class="mstkv-counter">Step <span data-role="counter"></span></span>
      </div>
    </div>
    <div class="mstkv-graph" data-role="graph"></div>
    <div class="mstkv-status" data-role="status"></div>
    <div class="mstkv-info">
      <div class="mstkv-line"><strong>Sorted edges:</strong> <span data-role="sorted"></span></div>
      <div class="mstkv-line"><strong>Accepted edges:</strong> <span data-role="accepted"></span></div>
      <div class="mstkv-line"><strong>Components:</strong> <span data-role="components"></span></div>
    </div>
    <div class="mstkv-legend">
      <div class="mstkv-legend-item"><span class="mstkv-swatch mstkv-swatch-current"></span> Edge currently considered</div>
      <div class="mstkv-legend-item"><span class="mstkv-swatch mstkv-swatch-tree"></span> Edge accepted into the forest</div>
      <div class="mstkv-legend-item"><span class="mstkv-swatch mstkv-swatch-rejected"></span> Edge rejected because it forms a cycle</div>
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("{{ viz_id }}");
      if (!root) return;
      function byRole(name) { return root.querySelector('[data-role="' + name + '"]'); }
      function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
      function html(s) { return "<p>" + esc(s).replace(/`([^`]+)`/g,"<code>$1</code>") + "</p>"; }
      function key(a,b) { return a < b ? a + "-" + b : b + "-" + a; }
      function has(a,x) { return a.indexOf(x) !== -1; }
      function copy(a) { return a.slice(); }
      var svgNS = "http://www.w3.org/2000/svg";
      var vertices = ["A","B","C","D"];
      var edges = [
        { u:"C", v:"D", w:3 },
        { u:"B", v:"D", w:4 },
        { u:"B", v:"C", w:5, label:[302,158] },
        { u:"A", v:"B", w:6 },
        { u:"A", v:"D", w:8, label:[302,202] },
        { u:"A", v:"C", w:10 }
      ];
      var pos = { A:[115,85], B:[425,85], C:[115,275], D:[425,275] };
      function edgeKey(e) { return key(e.u,e.v); }
      function edgeText(e) { return "(" + e.u + "," + e.v + "," + e.w + ")"; }
      function keysText(keys) {
        if (!keys.length) return "<code>-</code>";
        return "<code>" + keys.map(function (k) {
          return edgeText(edges.filter(function (e) { return edgeKey(e) === k; })[0]);
        }).join(", ") + "</code>";
      }
      function find(parent,x) { if (parent[x] !== x) parent[x] = find(parent,parent[x]); return parent[x]; }
      function componentText(parent) {
        var groups = {};
        vertices.forEach(function (v) {
          var r = find(parent,v);
          if (!groups[r]) groups[r] = [];
          groups[r].push(v);
        });
        return Object.keys(groups).map(function (r) { return "{" + groups[r].join(",") + "}"; }).join(", ");
      }
      function selectedFromEdges(edgeKeys) {
        var out = [];
        edgeKeys.forEach(function (k) {
          var e = edges.filter(function (x) { return edgeKey(x) === k; })[0];
          if (!has(out,e.u)) out.push(e.u);
          if (!has(out,e.v)) out.push(e.v);
        });
        return out;
      }
      function makeState(title, desc, current, accepted, rejected, selected, components) {
        return { title:title, desc:desc, current:current ? edgeKey(current) : null, accepted:copy(accepted), rejected:copy(rejected), selected:copy(selected), components:components };
      }
      function buildStates() {
        var parent = {}, accepted = [], rejected = [], states = [];
        vertices.forEach(function (v) { parent[v] = v; });
        states.push(makeState("Initial forest", "Start with singleton components and scan the sorted edge list.", null, accepted, rejected, [], componentText(parent)));
        edges.some(function (e) {
          var ru = find(parent,e.u), rv = find(parent,e.v);
          if (ru !== rv) {
            parent[rv] = ru;
            accepted.push(edgeKey(e));
            states.push(makeState("Accept " + edgeText(e), "The endpoints of `" + edgeText(e) + "` are in different components. Add it to the forest.", e, accepted, rejected, selectedFromEdges(accepted), componentText(parent)));
          } else {
            rejected.push(edgeKey(e));
            states.push(makeState("Reject " + edgeText(e), "The endpoints of `" + edgeText(e) + "` are already connected. Adding it would create a cycle.", e, accepted, rejected, selectedFromEdges(accepted), componentText(parent)));
          }
          return accepted.length === vertices.length - 1;
        });
        states.push(makeState("Finished", "The forest has `|V|-1` accepted edges, hence it is a spanning tree.", null, accepted, rejected, vertices, componentText(parent)));
        return states;
      }
      var states = buildStates(), index = 0, timer = null;
      function svgEl(name, attrs) {
        var el = document.createElementNS(svgNS,name);
        Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k,attrs[k]); });
        return el;
      }
      function edgeClass(s,e) {
        var k = edgeKey(e);
        if (s.current === k) return "mstkv-edge mstkv-edge-current";
        if (has(s.accepted,k)) return "mstkv-edge mstkv-edge-tree";
        if (has(s.rejected,k)) return "mstkv-edge mstkv-edge-rejected";
        return "mstkv-edge";
      }
      function nodeClass(s,v) {
        if (s.current) {
          var e = edges.filter(function (x) { return edgeKey(x) === s.current; })[0];
          if (e && (e.u === v || e.v === v)) return "mstkv-node mstkv-node-current";
        }
        if (has(s.selected,v)) return "mstkv-node mstkv-node-selected";
        return "mstkv-node";
      }
      function draw(s) {
        var target = byRole("graph");
        target.innerHTML = "";
        var svg = svgEl("svg", { viewBox:"0 0 540 360", role:"img", "aria-label":"Kruskal algorithm visualizer" });
        edges.forEach(function (e) {
          var a = pos[e.u], b = pos[e.v];
          svg.appendChild(svgEl("line", { x1:a[0], y1:a[1], x2:b[0], y2:b[1], class:edgeClass(s,e), "stroke-linecap":"round" }));
        });
        edges.forEach(function (e) {
          var a = pos[e.u], b = pos[e.v], x = e.label ? e.label[0] : (a[0]+b[0])/2, y = e.label ? e.label[1] : (a[1]+b[1])/2;
          svg.appendChild(svgEl("rect", { x:x-13, y:y-11, width:26, height:22, rx:5, ry:5, class:"mstkv-edge-label-bg" }));
          var t = svgEl("text", { x:x, y:y, class:"mstkv-edge-label" });
          t.textContent = String(e.w);
          svg.appendChild(t);
        });
        vertices.forEach(function (v) {
          var p = pos[v], g = svgEl("g", { class:nodeClass(s,v) });
          g.appendChild(svgEl("circle", { cx:p[0], cy:p[1], r:25 }));
          var t = svgEl("text", { x:p[0], y:p[1] });
          t.textContent = v;
          g.appendChild(t);
          svg.appendChild(g);
        });
        target.appendChild(svg);
      }
      function render() {
        var s = states[index], last = states.length - 1;
        byRole("counter").textContent = index + " / " + last;
        byRole("status").innerHTML = html("Step " + index + ": " + s.title + ". " + s.desc);
        byRole("sorted").innerHTML = "<code>" + edges.map(edgeText).join(", ") + "</code>";
        byRole("accepted").innerHTML = keysText(s.accepted);
        byRole("components").innerHTML = "<code>" + esc(s.components) + "</code>";
        byRole("prev").disabled = index === 0;
        byRole("next").disabled = index === last;
        byRole("run").textContent = timer ? "Pause" : "Run";
        draw(s);
      }
      function stopRun() {
        if (timer) clearInterval(timer);
        timer = null;
        var button = byRole("run");
        if (button) button.textContent = "Run";
      }
      function stepForward() {
        if (index >= states.length - 1) {
          stopRun();
          return false;
        }
        index += 1;
        render();
        if (index >= states.length - 1) stopRun();
        return true;
      }
      function toggleRun() {
        if (timer) {
          stopRun();
          return;
        }
        if (index >= states.length - 1) {
          index = 0;
          render();
        }
        timer = setInterval(stepForward, 800);
        byRole("run").textContent = "Pause";
      }
      function start() {
        if (root.dataset.initialized === "true") return;
        root.dataset.initialized = "true";
        byRole("prev").addEventListener("click", function () { stopRun(); if (index > 0) { index -= 1; render(); } });
        byRole("next").addEventListener("click", function () { stopRun(); stepForward(); });
        byRole("run").addEventListener("click", toggleRun);
        byRole("reset").addEventListener("click", function () { stopRun(); index = 0; render(); });
        render();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start, { once:true });
      else start();
    })();
  </script>
</div>
